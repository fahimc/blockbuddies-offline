name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build unsigned Android release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build.log
        working-directory: android
      - name: Sign main BlockBuddies APK with the v1.5.79 update key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_UPDATE_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPDATE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          APK_NAME="BlockBuddies-Offline-v${VERSION}.apk"
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          BUILD_TOOLS="$(find "${ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          EXPECTED_SIGNER_SHA256="ab79aba264ecc6b80736355d1835179ddab9f3c91d8d1d4c85a9292942aad19c"

          test -n "${UNSIGNED_APK}"
          test -n "${ANDROID_UPDATE_KEYSTORE_BASE64}"
          test -x "${BUILD_TOOLS}/zipalign"
          test -x "${BUILD_TOOLS}/apksigner"
          test -x "${BUILD_TOOLS}/aapt"

          mkdir -p release signing
          printf '%s' "${ANDROID_UPDATE_KEYSTORE_BASE64}" \
            | base64 --decode > signing/blockbuddies-update.keystore

          "${BUILD_TOOLS}/zipalign" -p -f 4 \
            "${UNSIGNED_APK}" release/aligned.apk
          "${BUILD_TOOLS}/apksigner" sign \
            --ks signing/blockbuddies-update.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "release/${APK_NAME}" \
            release/aligned.apk
          rm release/aligned.apk

          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs \
            "release/${APK_NAME}" | tee release/SIGNING-CERTIFICATE.txt
          grep -qi "certificate SHA-256 digest: ${EXPECTED_SIGNER_SHA256}" \
            release/SIGNING-CERTIFICATE.txt
          "${BUILD_TOOLS}/aapt" dump badging "release/${APK_NAME}" \
            | tee release/APK-BADGING.txt
          grep -q "package: name='com.blockbuddies.offline'" release/APK-BADGING.txt
          grep -q "application-label:'BlockBuddies'" release/APK-BADGING.txt

          cd release
          sha256sum "${APK_NAME}" > SHA256SUMS.txt
      - name: Upload Android APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: blockbuddies-android-apk
          path: release/*
          if-no-files-found: error
      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/gradle-build.log
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: blockbuddies-android-apk
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi

          test -f "${NOTES_FILE}"
          gh release create "${TAG}" release/* \
            --target "${GITHUB_SHA}" \
            --title "BlockBuddies Offline ${TAG}" \
            --notes-file "${NOTES_FILE}"
