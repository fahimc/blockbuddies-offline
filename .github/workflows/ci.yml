name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build unsigned Android release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build.log
        working-directory: android
      - name: Sign main BlockBuddies APK with stable test certificate
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          APK_NAME="BlockBuddies-Offline-v${VERSION}.apk"
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          BUILD_TOOLS="$(find "${ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          test -n "${UNSIGNED_APK}"
          test -x "${BUILD_TOOLS}/zipalign"
          test -x "${BUILD_TOOLS}/apksigner"
          test -x "${BUILD_TOOLS}/aapt"

          mkdir -p release signing

          # The AOSP test key is public and reproducible. It is intentionally used
          # only for direct-install test releases, but unlike runner debug keys it
          # remains identical across GitHub Actions runs so future APKs can update.
          curl --fail --location --retry 3 \
            --output signing/testkey.pk8 \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8
          curl --fail --location --retry 3 \
            --output signing/testkey.x509.pem \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem

          openssl pkcs8 -inform DER -in signing/testkey.pk8 \
            -out signing/testkey.pem -nocrypt
          openssl pkcs12 -export \
            -inkey signing/testkey.pem \
            -in signing/testkey.x509.pem \
            -name blockbuddies \
            -out signing/blockbuddies-test.p12 \
            -passout pass:android

          "${BUILD_TOOLS}/zipalign" -p -f 4 \
            "${UNSIGNED_APK}" release/aligned.apk
          "${BUILD_TOOLS}/apksigner" sign \
            --ks signing/blockbuddies-test.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "release/${APK_NAME}" \
            release/aligned.apk
          rm release/aligned.apk

          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs \
            "release/${APK_NAME}" | tee release/SIGNING-CERTIFICATE.txt
          "${BUILD_TOOLS}/aapt" dump badging "release/${APK_NAME}" \
            | tee release/APK-BADGING.txt
          grep -q "package: name='com.blockbuddies.offline'" release/APK-BADGING.txt
          grep -q "application-label:'BlockBuddies'" release/APK-BADGING.txt

          cd release
          sha256sum "${APK_NAME}" > SHA256SUMS.txt
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockbuddies-android-apk
          path: release/*
          if-no-files-found: error
      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/gradle-build.log
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: blockbuddies-android-apk
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi

          test -f "${NOTES_FILE}"
          gh release create "${TAG}" release/* \
            --target "${GITHUB_SHA}" \
            --title "BlockBuddies Offline ${TAG}" \
            --notes-file "${NOTES_FILE}"
