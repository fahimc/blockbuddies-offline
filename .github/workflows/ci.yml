name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build Android debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
        working-directory: android
      - name: Prepare APK and checksum
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APK_NAME="BlockBuddies-Offline-v${VERSION}-debug.apk"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          cd release
          sha256sum "${APK_NAME}" > SHA256SUMS.txt
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockbuddies-android-apk
          path: release/*
          if-no-files-found: error
      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/gradle-build.log
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: blockbuddies-android-apk
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi

          test -f "${NOTES_FILE}"
          gh release create "${TAG}" release/* \
            --target "${GITHUB_SHA}" \
            --title "BlockBuddies Offline ${TAG}" \
            --notes-file "${NOTES_FILE}"
